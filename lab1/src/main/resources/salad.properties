# Initialization parameters of the chef application.
chef.name=Gordon
salad.name=Spring salad
# Comma separated list of type:weight (grams).
# Types: carrot, beet, radish, tomato, cucumber, bell_pepper,
#        lettuce, cabbage, onion, garlic
salad.ingredients=tomato:200, cucumber:150, bell_pepper:100, \
  radish:80, lettuce:60, onion:40, garlic:5
# NAME, WEIGHT, CALORIES, CALORIES_PER_100G, CATEGORY
sort.by=CALORIES
# Range (kcal) to search vegetables in the salad.
calories.min=10
calories.max=30
